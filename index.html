<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="DZ Domino : le domino à l’algérienne, contre l’IA ou en ligne avec vos amis, sans compte.">
<meta name="theme-color" content="#0c2426">
<title>DZ Domino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rakkas&family=Figtree:wght@400;500;600;700&display=swap">
<style>html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<style>
:root{
  color-scheme:dark;
  --bg:#0c2426;
  --panel:#11302f;
  --panel-2:#163a38;
  --felt:#17463f;
  --felt-deep:#0f3530;
  --line:#2a5550;
  --ink:#ece6d5;
  --muted:#9fb8b1;
  --ivory:#f3eddc;
  --ivory-edge:#cfc4aa;
  --pip:#1c1915;
  --ochre:#e3aa3c;
  --coral:#ec7c5f;
  --good:#8fd19e;
  --focus:#f7d27a;
  --p0:#e3aa3c;
  --p1:#ec7c5f;
  --p2:#8ec3e6;
  --p3:#c7a3ec;
  --dz:#e8283f;
}
body{background-color:var(--bg);color:var(--ink);font:15px/1.5 Figtree,"Segoe UI",system-ui,sans-serif;padding-inline:16px;min-height:100vh;
  background-repeat:no-repeat;background-attachment:fixed;background-image:radial-gradient(circle at 20% 0%,rgba(227,170,60,.07),transparent 40%),radial-gradient(circle at 90% 100%,rgba(236,124,95,.06),transparent 45%);}
.wrap{max-width:980px;margin:0 auto;padding-block:18px 40px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:Rakkas,Georgia,serif;font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:clamp(34px,7vw,56px);line-height:1.05}
.logo{font-size:clamp(46px,10vw,76px);line-height:1;letter-spacing:.03em;white-space:nowrap}
.logo .dz{color:var(--dz)}
.logo .dom{color:#fff}
h2{font-size:24px}
h3{font-size:19px}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--ochre);font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn{background:var(--ochre);color:#231a08;border:0;border-radius:10px;padding:10px 16px;font-weight:700}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--panel-2)}
.btn.small{padding:6px 11px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
input.nick{font:500 16px/1.2 Figtree,system-ui,sans-serif;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;max-width:260px}
.trow .who{display:block;font-size:12.5px;color:var(--ink);opacity:.85;margin-top:2px}
input.code{font:600 18px/1 Figtree,monospace;letter-spacing:.3em;text-transform:uppercase;width:8.5em;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}

/* ---- tiles ---- */
.tile{display:inline-flex;flex:none;background:var(--ivory);border-radius:calc(var(--u)*.17);
  box-shadow:0 1px 0 var(--ivory-edge),0 2px 5px rgba(0,0,0,.4)}
.tile.h{flex-direction:row;width:calc(var(--u)*2);height:var(--u)}
.tile.v{flex-direction:column;width:var(--u);height:calc(var(--u)*2)}
.half{flex:1;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:calc(var(--u)*.13)}
.tile.h .half+.half{border-left:1px solid #b9ae95}
.tile.v .half+.half{border-top:1px solid #b9ae95}
.pip{width:72%;height:72%;border-radius:50%;background:var(--pip);place-self:center}
.tile.back{background:repeating-linear-gradient(45deg,#2b5d56 0 3px,#24514b 3px 6px);box-shadow:0 0 0 1px #3c726a inset,0 1px 3px rgba(0,0,0,.4)}

/* ---- lobby ---- */
.hero{display:flex;gap:22px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;padding-top:8px}
.hero .deco{--u:30px;display:flex;gap:8px;transform:rotate(-6deg)}
.hero .deco .tile:nth-child(2){transform:translateY(10px) rotate(9deg)}
.tables{display:flex;flex-direction:column;gap:8px}
.trow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;background:var(--panel-2);flex-wrap:wrap}
.trow .code{font-weight:700;letter-spacing:.2em;font-variant-numeric:tabular-nums}
.trow .grow{flex:1;min-width:120px}
.rules{columns:2 260px;column-gap:28px;margin:0;padding-left:18px}
.rules li{margin-bottom:6px;break-inside:avoid}

/* ---- table ---- */
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar .grow{flex:1}
.tcode{font-weight:700;letter-spacing:.25em;background:var(--panel-2);border:1px solid var(--line);padding:5px 10px;border-radius:8px;font-variant-numeric:tabular-nums}
.scores{display:flex;gap:8px;flex-wrap:wrap}
.score{display:flex;align-items:baseline;gap:8px;padding:6px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.score b{font:400 24px/1 Rakkas,Georgia,serif;font-variant-numeric:tabular-nums}
.score.A{box-shadow:inset 3px 0 0 var(--ochre)}
.score.B{box-shadow:inset 3px 0 0 var(--coral)}
.score small{color:var(--muted);font-size:12px}
.teamdot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.teamdot.A{background:var(--ochre)}.teamdot.B{background:var(--coral)}
.teamdot.P0{background:var(--p0)}.teamdot.P1{background:var(--p1)}.teamdot.P2{background:var(--p2)}.teamdot.P3{background:var(--p3)}
.score.P0{box-shadow:inset 3px 0 0 var(--p0)}.score.P1{box-shadow:inset 3px 0 0 var(--p1)}.score.P2{box-shadow:inset 3px 0 0 var(--p2)}.score.P3{box-shadow:inset 3px 0 0 var(--p3)}

.seats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.seat{border:1px dashed var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;min-height:92px}
.seat.taken{border-style:solid;background:var(--panel-2)}
.seat .who{font-weight:600;display:flex;gap:8px;align-items:center}

.others{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:10px}
.others.four{grid-template-columns:repeat(4,1fr)}
@media (max-width:520px){ .others.four{grid-template-columns:repeat(2,1fr)} }
.chip .btn{align-self:flex-start;white-space:normal;text-align:left}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0;transition:box-shadow .2s,border-color .2s}
.chip.turn{border-color:var(--focus);box-shadow:0 0 0 2px rgba(247,210,122,.35)}
.chip .top{display:flex;align-items:center;gap:6px;min-width:0}
.chip .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .pos{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.backs{--u:9px;display:flex;gap:2px;flex-wrap:wrap;min-height:18px}
.reveal{--u:11px;display:flex;gap:3px;flex-wrap:wrap}
.bubble{font-size:12px;font-weight:600;color:#231a08;background:var(--ivory);border-radius:999px;padding:1px 8px;align-self:flex-start}

.board{--u:23px;background:radial-gradient(ellipse at center,var(--felt),var(--felt-deep));border-radius:18px;border:6px solid #0a1f1e;
  box-shadow:inset 0 0 40px rgba(0,0,0,.45);padding:22px 14px;min-height:170px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.board.dense{--u:18px}
.chain{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px 3px}
.chain .tile.new{animation:drop .35s ease-out}
@keyframes drop{from{transform:translateY(-8px) scale(1.08);box-shadow:0 8px 14px rgba(0,0,0,.5)}}
.boardmsg{text-align:center;color:#cfe3dc}
.ends{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.endinfo{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:#bcd6ce;text-transform:uppercase;letter-spacing:.1em}
.stock{display:inline-flex;align-items:center;gap:6px;--u:8px;text-transform:none;letter-spacing:.02em;color:#dcebe6;font-variant-numeric:tabular-nums}
.boardstock{display:flex;justify-content:center}

.mine{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.mine.turn{border-color:var(--focus);box-shadow:0 0 0 2px rgba(247,210,122,.3)}
.status{font-weight:600}
.hand{--u:36px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding-top:8px}
.hand button{background:none;border:0;padding:0;border-radius:8px;transition:transform .15s,opacity .15s}
.hand button.ok{transform:translateY(-6px)}
.hand button.ok:hover{transform:translateY(-10px)}
.hand button.no{opacity:.45;cursor:default}
.hand button.sel{transform:translateY(-12px)}
.hand button.sel .tile{box-shadow:0 0 0 3px var(--focus),0 6px 10px rgba(0,0,0,.4)}
.hand button.drawn .tile{box-shadow:0 0 0 2px var(--good),0 2px 5px rgba(0,0,0,.4)}
.snake{position:relative;width:100%}
.snake>.tile{position:absolute}
.snake .tile.new{animation:drop .35s ease-out}
.snake .tile.mark{box-shadow:0 0 0 2px var(--mc),0 2px 5px rgba(0,0,0,.45)}
.snake .tile.latest{box-shadow:0 0 0 3px var(--mc),0 0 16px 3px var(--mc)}
.endmark{position:absolute;display:grid;place-items:center;padding:0;border-radius:50%;border:1.5px dashed rgba(243,237,220,.6);background:rgba(0,0,0,.2);color:#f3eddc;font:700 12px/1 Figtree,system-ui,sans-serif}
.endmark.pick{border:2px solid var(--focus);background:var(--ochre);color:#231a08;cursor:pointer;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(247,210,122,.35)}}
.tile.mini{--u:14px}
.lastact{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px}
.think{font-size:12px;color:var(--muted)}
.recap{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.rlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rrow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:14px}
.rrow.think,.rrow.note{color:var(--muted)}
.seg.small button{padding:4px 9px;font-size:12.5px}
.rcap{font-size:12px;color:var(--muted)}
.tmr{position:relative;height:17px;border-radius:8px;background:rgba(255,255,255,.07);overflow:hidden;display:flex;align-items:center;justify-content:flex-end;padding:0 7px;font-size:12px}
.tmr i{position:absolute;left:0;top:0;bottom:0;width:100%;background:rgba(143,209,158,.42);transition:width .25s linear}
.tmr b{position:relative;font-weight:700;font-variant-numeric:tabular-nums}
.tmr.low i{background:rgba(236,124,95,.62)}
.tag{font-size:11.5px;color:var(--coral);border:1px solid rgba(236,124,95,.5);border-radius:999px;padding:0 7px}
.btn.sound{display:inline-flex;align-items:center;padding:6px 9px}
.rp-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.rp-note{color:var(--focus);font-weight:600}
.rp-cap{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.rp-end{font-weight:700;color:var(--focus)}
.rp-ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rp-range{flex:1;min-width:140px;accent-color:var(--ochre)}
.rp-hands{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.rp-hand{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.rp-hand.act{border-color:var(--focus);box-shadow:0 0 0 2px rgba(247,210,122,.3)}
.rp-hand .reveal{--u:15px}

/* ---- AI setup ---- */
.field{display:flex;flex-direction:column;gap:7px}
.lab{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;display:flex;flex-direction:column;gap:2px}
.opt b{font-weight:700;font-size:14px}
.opt span{font-size:12.5px;color:var(--muted);line-height:1.35}
.opt[aria-pressed="true"]{border-color:var(--ochre);box-shadow:inset 0 0 0 1px var(--ochre);background:rgba(227,170,60,.08)}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden;align-self:flex-start;max-width:100%}
.seg button{background:transparent;border:0;padding:7px 13px;font-size:14px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ochre);color:#231a08;font-weight:700}
.hint{font-size:12.5px;color:var(--muted)}
.help{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--panel-2)}
.help summary{cursor:pointer;color:var(--focus);font-weight:600;font-size:13.5px;min-height:28px;display:flex;align-items:center;gap:6px;list-style:none}
.help summary::-webkit-details-marker{display:none}
.help summary::before{content:'▸';font-size:12px;transition:transform .15s}
.help[open] summary::before{transform:rotate(90deg)}
.help[open] summary{margin-bottom:6px}
.help p{margin-bottom:6px}
.help ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.warn{color:var(--coral);font-weight:600;font-size:13.5px}
[hidden]{display:none!important}
.field .row input.nick{flex:1 1 140px;min-width:0}
@media (max-width:520px){
  .seats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .seat{padding:10px;min-height:0;gap:6px}
  .seat .row{flex-direction:column;align-items:stretch;gap:6px}
  .seat .btn{width:100%}
}
@media (max-height:500px) and (orientation:landscape){
  .board{--u:17px}
  .others .chip{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;column-gap:10px;row-gap:3px}
  .others .chip .pos{grid-column:1}
  .others .chip .top{grid-column:2}
  .others .chip .backs{grid-column:1;min-height:0}
  .others .chip > :not(.pos):not(.top):not(.backs){grid-column:2}
  .mine.dock{display:grid;grid-template-columns:minmax(170px,32%) minmax(0,1fr);column-gap:14px;align-items:center}
  .mine.dock > *{grid-column:1}
  .mine.dock > .hand{grid-column:2;grid-row:1 / span 4;padding-top:0}
}
@media (max-width:420px){ .opts{grid-template-columns:1fr} }
@media (max-width:520px){ .hand{--u:32px;gap:6px} .board{--u:19px;padding:14px 8px;min-height:110px} .board.dense{--u:15px} .others{gap:6px} .chip{padding:8px;gap:4px} }
/* phones: compact header, scores side by side */
.score .sm{display:none}
@media (max-width:520px){
  .wrap{gap:12px;padding-block:12px 28px}
  .topbar{gap:8px}
  .scores{width:100%}
  .score{flex:1 1 0;min-width:0;justify-content:center;padding:5px 8px;gap:6px}
  .score b{font-size:21px}
  .score .of{font-size:11px}
}
@media (max-width:420px){ .score .lg{display:none} .score .sm{display:inline} }
/* my hand stays on screen during play */
.mine.dock{position:sticky;bottom:0;z-index:4;box-shadow:0 -10px 24px rgba(0,0,0,.45);padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.mine .ends{justify-content:flex-start}
/* phone held sideways: less height for the table and the hand */
@media (max-width:359px){ .hand{gap:5px} }
@media (max-height:500px) and (orientation:landscape){ .board{min-height:80px;padding-block:8px} .hand{--u:30px} .mine{gap:8px;padding-block:10px} .others .chip{padding:7px 9px} }
/* touch screens: bigger targets */
@media (pointer:coarse), (max-width:520px), (max-height:500px){ .btn.small{min-height:38px} .seg button{min-height:38px} .rp-range{height:36px} .endmark.pick{transform:scale(1.3)} }
.chip .nm{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;line-height:1.25}

.result{border:1px solid var(--focus);background:linear-gradient(180deg,rgba(247,210,122,.08),transparent);}
.resrows{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.resrow{background:var(--panel-2);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px}
.resrow .pts{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.log{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.log div:last-child{color:var(--ink)}
.askbox{border:2px solid var(--focus);background:rgba(247,210,122,.1);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;animation:pulse 1.2s ease-in-out 3}
.stwrap{overflow-x:auto}
table.stats{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.stats th,table.stats td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
table.stats th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
table.stats th:first-child,table.stats td:first-child{text-align:left}
table.stats tr.me td{color:var(--ochre);font-weight:700}
.confetti{position:fixed;top:-20px;width:9px;height:14px;border-radius:2px;z-index:30;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(760deg)}}
.circus{position:fixed;inset:0;z-index:25;display:grid;place-items:center;padding:16px;overflow:hidden;background:#b3202f}
.circus::before{content:'';position:absolute;left:50%;top:50%;width:260vmax;height:260vmax;margin:-130vmax 0 0 -130vmax;background:repeating-conic-gradient(#d62839 0 10deg,#f5ecd6 10deg 20deg);animation:spin 18s linear infinite}
.circus .clown{position:absolute;bottom:-12vh;font-size:38px;animation:floatup linear infinite;z-index:1}
@keyframes floatup{from{transform:translateY(0) rotate(0)}to{transform:translateY(-130vh) rotate(360deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
.cbox{position:relative;z-index:2;background:var(--panel);border:4px solid var(--ochre);border-radius:20px;padding:22px 20px;text-align:center;max-width:380px;width:calc(100vw - 48px);display:flex;flex-direction:column;gap:10px;align-items:center;box-shadow:0 20px 60px rgba(0,0,0,.55);animation:wobble 1.4s ease-in-out infinite alternate}
.cbox h2{font-size:40px;color:#e8283f;letter-spacing:.06em}
.cbox .big{font-size:18px;font-weight:600}
.cbig{font-size:76px;line-height:1;animation:bounce .55s ease-in-out infinite alternate}
@keyframes bounce{to{transform:translateY(-14px) scale(1.08)}}
@keyframes wobble{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ivory);color:#1c1915;padding:10px 16px;border-radius:10px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.4);max-width:calc(100% - 32px);z-index:5}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>

<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ======================= Jeu en ligne (serveur MQTT public, sans compte) ======================= */
/* Chaque table est un message « retenu » sur le serveur : tous les joueurs qui ouvrent la table
   reçoivent la dernière version et chaque coup publie la nouvelle. Les tables expirent après 24 h. */
const NET={url:'wss://broker.emqx.io:8084/mqtt', root:'dzdomino-baibenimed/v1/', ttl:86400};
let netWasOffline=false;
function mqttDb(){
  return new Promise(resolve=>{
    if(!window.mqtt){ resolve(null); return; }
    let client;
    try{ client=mqtt.connect(NET.url,{protocolVersion:5,clientId:'dzd_'+Math.random().toString(16).slice(2,12),reconnectPeriod:2000,connectTimeout:10000,clean:true}); }
    catch(e){ resolve(null); return; }
    const cache=new Map(), subs=new Map(), dec=new TextDecoder();
    const match=(f,t)=>{ if(f===t) return true; if(f.endsWith('/+')){ const p=f.slice(0,-1); return t.startsWith(p) && !t.slice(p.length).includes('/'); } return false; };
    client.on('message',(topic,buf)=>{
      let data=null; const txt=dec.decode(buf);
      if(txt){ try{ data=JSON.parse(txt); }catch(e){ return; } }
      // Never go back in time: a table only moves forward (a copy received twice, or an older
      // version arriving late through a second subscription, is ignored).
      const prev=cache.get(topic);
      if(data && prev && typeof data.v==='number' && typeof prev.v==='number'){
        if(data.v<prev.v) return;
        if(data.v===prev.v && data.updatedAt===prev.updatedAt && data.w===prev.w) return;
      }
      cache.set(topic,data);
      for(const [f,ls] of subs) if(match(f,topic)) [...ls].forEach(fn=>{ try{ fn(topic,data); }catch(e){ console.error(e); } });
    });
    function listen(filter,fn){
      let ls=subs.get(filter);
      if(!ls){ ls=new Set(); subs.set(filter,ls); client.subscribe(filter,{qos:1}); }
      ls.add(fn);
      return ()=>{ ls.delete(fn); if(!ls.size){ subs.delete(filter); client.unsubscribe(filter); } };
    }
    const snap=d=>({exists:d!=null, data:()=>d});
    const db={
      doc(path){
        const topic=NET.root+path;
        return {
          get(){
            if(subs.has(topic) && cache.has(topic)) return Promise.resolve(snap(cache.get(topic)));
            return new Promise(res=>{
              let done=false, off=null;
              const fin=d=>{ if(done) return; done=true; if(off) off(); res(snap(d)); };
              off=listen(topic,(t,d)=>fin(d));
              setTimeout(()=>fin(cache.has(topic)?cache.get(topic):null),1500);
            });
          },
          set(data,opt={}){
            return new Promise((res,rej)=>{
              if(!client.connected){ rej({code:'offline'}); return; }
              const props=opt.keep?{}:{messageExpiryInterval:NET.ttl};
              // never wait forever (phone in the background, network gone): the move is refused and can be replayed
              const tm=setTimeout(()=>rej({code:'timeout'}),8000);
              client.publish(topic,JSON.stringify(data),{qos:1,retain:true,properties:props},err=>{ clearTimeout(tm); err?rej(err):res(); });
            });
          },
          acquire(){ return Promise.resolve({acquired:true}); },
          onSnapshot(cb){
            let seen=false;
            const off=listen(topic,(t,d)=>{ seen=true; cb(snap(d)); });
            if(cache.has(topic) && cache.get(topic)!=null){ seen=true; setTimeout(()=>cb(snap(cache.get(topic))),0); }
            const tm=setTimeout(()=>{ if(!seen) cb(snap(null)); },3000);
            return ()=>{ clearTimeout(tm); off(); };
          }
        };
      },
      collection(name){
        const filter=NET.root+name+'/+';
        const q={_n:40, orderBy(){ return q; }, limit(n){ q._n=n; return q; },
          onSnapshot(cb){
            const emit=()=>{ const docs=[]; for(const [t,d] of cache) if(d && match(filter,t)) docs.push(d);
              docs.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
              cb({docs:docs.slice(0,q._n).map(d=>({data:()=>d}))}); };
            let tm=null;
            const off=listen(filter,()=>{ clearTimeout(tm); tm=setTimeout(emit,150); });
            emit();
            return ()=>{ clearTimeout(tm); off(); };
          }};
        return q;
      }
    };
    let settled=false;
    client.on('connect',()=>{
      if(netWasOffline){ netWasOffline=false; toast('Reconnecté au jeu en ligne.'); }
      if(!settled){ settled=true; resolve(db); }
    });
    // back on the page (phone unlocked, tab reopened): reconnect at once and get the latest tables
    document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && !client.connected){ try{ client.reconnect(); }catch(e){} } });
    window.addEventListener('online',()=>{ if(!client.connected){ try{ client.reconnect(); }catch(e){} } });
    client.on('offline',()=>{ if(settled && !netWasOffline){ netWasOffline=true; toast('Connexion au jeu en ligne perdue, reconnexion…'); } });
    setTimeout(()=>{ if(!settled){ settled=true; resolve(null); try{ client.end(true); }catch(e){} } },12000);
  });
}

/* ======================= Rules engine ======================= */
const TARGET = 100;
const TEAM = ['A','B'];
const isBot = s => typeof s === 'string' && s.startsWith('bot');
const clone = o => JSON.parse(JSON.stringify(o));
const pipsOf = h => h.reduce((a,t)=>a+t[0]+t[1],0);
const k2 = t => Math.min(t[0],t[1])+'-'+Math.max(t[0],t[1]);
const same = (t,u) => !!t && !!u && k2(t)===k2(u);
const ALL = (()=>{ const a=[]; for(let x=0;x<=6;x++) for(let y=x;y<=6;y++) a.push([x,y]); return a; })();
const byPips = (x,y)=>(x[0]+x[1])-(y[0]+y[1]);
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* n = 2, 3 or 4 players. teams = 2 contre 2 (only with 4). With 2 or 3 players
   the tiles left after dealing 7 each form the stock ("pioche"). */
function newTable(code, seat0, opt={}){
  const n=opt.n||4, teams= n===4 && opt.teams!==false;
  return {code, createdAt:Date.now(), updatedAt:Date.now(), v:1, status:'waiting', target:TARGET,
    n, teams, level:opt.level||'moyen', drawRule:opt.drawRule||'until', turnSecs:opt.turnSecs||0,
    seats:[seat0,...Array(n-1).fill(null)], scores:Array(teams?2:n).fill(0), round:0,
    hands:Array.from({length:n},()=>[]), talon:[], line:[], turn:0, openTile:null,
    lineBy:[], lineNo:[], moveNo:0, last:Array(n).fill(null),
    voids:Array.from({length:n},()=>[]), lastWinner:null, result:null, events:[], hist:null, nicks:{}};
}
/* Tables saved by the first version have no player count, stock or opening tile. */
function norm(s){
  if(!s) return s;
  if(s.n==null) s.n=(s.seats||[]).length||4;
  if(s.teams==null) s.teams=s.n===4;
  if(!s.talon) s.talon=[];
  if(!s.voids) s.voids=Array.from({length:s.n},()=>[]);
  if(s.openTile===undefined) s.openTile = s.mustDouble6 && !(s.line||[]).length ? [6,6] : null;
  delete s.mustDouble6;
  if(!s.level) s.level='moyen';
  if(!s.drawRule) s.drawRule='until';
  if(!s.lineBy) s.lineBy=(s.line||[]).map(()=>null);   // who placed each tile of the line
  if(!s.lineNo) s.lineNo=(s.line||[]).map(()=>0);      // in which move of the round
  if(s.moveNo==null) s.moveNo=0;
  if(!s.last) s.last=Array(s.n).fill(null);            // each player's last action this round
  if(s.turnSecs==null) s.turnSecs=0;                     // seconds per move, 0 = no limit
  if(s.hist===undefined) s.hist=null;                   // the whole round, for "Revoir la manche"
  if(!s.nicks || typeof s.nicks!=='object') s.nicks={};  // names the players typed, by player id
  return s;
}
const grp=(s,p)=>s.teams?p%2:p;               // index in s.scores
function ev(s,e){ s.events=[...(s.events||[]), e].slice(-12); }
function ends(s){ return s.line.length?[s.line[0][0],s.line[s.line.length-1][1]]:null; }
/* Who opens when nobody won the previous round: the biggest double, else the biggest tile. */
function strongest(hands){
  let best=null, holder=-1, bs=-1;
  hands.forEach((h,p)=>h.forEach(t=>{ const sc=(t[0]===t[1]?1000:0)+(t[0]+t[1])*10+Math.max(t[0],t[1]); if(sc>bs){ bs=sc; best=t; holder=p; } }));
  return {tile:best?[best[0],best[1]]:null, holder};
}
function deal(s){
  const all=shuffle(clone(ALL));
  s.hands=Array.from({length:s.n},(_,i)=>all.slice(i*7,i*7+7).sort(byPips));
  s.talon=all.slice(s.n*7);
  s.round=(s.round||0)+1; s.line=[]; s.result=null; s.ask=null; s.noBlock=null;
  if(s.round===1 || !s.gameId) s.gameId=Math.random().toString(36).slice(2,10);
  s.lineBy=[]; s.lineNo=[]; s.moveNo=0; s.last=Array(s.n).fill(null);
  s.voids=Array.from({length:s.n},()=>[]);
  if(s.round===1 || s.lastWinner==null){ const o=strongest(s.hands); s.turn=o.holder; s.openTile=o.tile; }
  else { s.turn=s.lastWinner; s.openTile=null; }
  s.status='playing';
  s.hist={hands0:clone(s.hands), talon0:clone(s.talon), turn0:s.turn, openTile:s.openTile?[s.openTile[0],s.openTile[1]]:null, moves:[]};
  ev(s,{k:'deal',seat:s.turn,r:s.round,o:s.openTile});
}
function legal(s,seat){
  const h=s.hands[seat]||[], res=[];
  if(!s.line.length){ h.forEach((t,i)=>{ if(!s.openTile||same(t,s.openTile)) res.push({i,side:'R'}); }); return res; }
  const L=s.line[0][0], R=s.line[s.line.length-1][1];
  h.forEach((t,i)=>{
    const fl=t[0]===L||t[1]===L, fr=t[0]===R||t[1]===R;
    if(fl) res.push({i,side:'L'});
    if(fr && !(fl && L===R)) res.push({i,side:'R'});

}
const canPlay=(s,seat)=>legal(s,seat).length>0;
function blocked(s){ return !s.talon.length && s.hands.every((_,p)=>!canPlay(s,p)); }
function play(s,seat,i,side){
  const t=s.hands[seat].splice(i,1)[0];
  const prev=s.last[seat], drew=prev && prev.k==='draw' && prev.n===s.moveNo ? prev.c : 0;
  const no=++s.moveNo; let where=null;
  const on= !s.line.length ? null : side==='L' ? s.line[0][0] : s.line[s.line.length-1][1];
  if(!s.line.length){ s.line.push(t); s.lineBy.push(seat); s.lineNo.push(no); }
  else if(side==='L'){ const L=s.line[0][0]; s.line.unshift(t[1]===L?[t[0],t[1]]:[t[1],t[0]]); s.lineBy.unshift(seat); s.lineNo.unshift(no); where='L'; }
  else { const R=s.line[s.line.length-1][1]; s.line.push(t[0]===R?[t[0],t[1]]:[t[1],t[0]]); s.lineBy.push(seat); s.lineNo.push(no); where='R'; }
  s.openTile=null;
  const auto=s._auto?true:undefined;                    // played by the AI because the time ran out
  s.last[seat]={k:'play',t:[t[0],t[1]],side:where,on,n:no,drew,auto};
  ev(s,{k:'play',seat,t,side:where,on,auto});
  if(s.hist) s.hist.moves.push({k:'play',seat,t:[t[0],t[1]],side:where,on,auto});
  if(!s.hands[seat].length) return endRound(s,'domino',seat);
  if(blocked(s)) return endRound(s,'blocked',seat);
  s.turn=(seat+1)%s.n;
}
/* The player has no playable tile. With a stock: draw one and pass (drawRule 'one'),
   or draw until a tile fits and then play it (drawRule 'until'). Without a stock: pass.
   voids[p] = numbers everybody now knows p does not hold. */
function noMove(s,seat){
  const e=ends(s);
  if(s.talon.length){
    let c=0;
    do{ s.hands[seat].push(s.talon.pop()); c++; } while(s.drawRule==='until' && s.talon.length && !canPlay(s,seat));
    const can=canPlay(s,seat);
    s.voids[seat]= !can && e ? [...new Set(e)] : [];
    const auto=s._auto?true:undefined;
    s.last[seat]={k:'draw',c,n:++s.moveNo,auto};
    ev(s,{k:'draw',seat,c,auto});
    if(s.hist) s.hist.moves.push({k:'draw',seat,c,auto});
    if(s.drawRule==='until' && can) return;              // same player now plays the tile
  } else {
    if(e) s.voids[seat]=[...new Set([...s.voids[seat],...e])];
    const auto=s._auto?true:undefined;
    s.last[seat]={k:'pass',n:++s.moveNo,auto};
    ev(s,{k:'pass',seat,auto});
    if(s.hist) s.hist.moves.push({k:'pass',seat,auto});
  }
  if(blocked(s)) return endRound(s,'blocked',seat);
  s.turn=(seat+1)%s.n;
}
function endRound(s,kind,seat){
  const pips=s.hands.map(pipsOf);
  let winner=null;
  if(kind==='domino') winner=seat;
  else {
    const min=Math.min(...pips), ws=pips.map((x,p)=>x===min?p:-1).filter(p=>p>=0);
    if(new Set(ws.map(p=>grp(s,p))).size===1){ for(let k=1;k<=s.n;k++){ const p=(seat+k)%s.n; if(ws.includes(p)){ winner=p; break; } } }
  }
  let pts=0;
  if(winner!=null){ pts=pips.reduce((a,x,p)=>a+(grp(s,p)===grp(s,winner)?0:x),0); s.scores[grp(s,winner)]+=pts; }
  s.lastWinner=winner;
  s.result={kind,winner,team:s.teams&&winner!=null?winner%2:null,pts,pips};
  s.status=(winner!=null && s.scores[grp(s,winner)]>=s.target)?'over':'roundEnd';
  ev(s,{k:kind,seat:winner,pts});
}

/* Replays a finished round from its history: one frame per move, with every hand visible. */
function buildFrames(st){
  const H=st && st.hist; if(!H) return null;
  const sim={n:st.n,teams:st.teams,drawRule:st.drawRule,target:Infinity,scores:st.scores.map(()=>0),round:st.round,
    hands:clone(H.hands0),talon:clone(H.talon0),line:[],lineBy:[],lineNo:[],moveNo:0,last:Array(st.n).fill(null),
    voids:Array.from({length:st.n},()=>[]),openTile:H.openTile?[H.openTile[0],H.openTile[1]]:null,turn:H.turn0,
    status:'playing',events:[],lastWinner:null,result:null,hist:null};
  const frame=m=>({move:m,line:clone(sim.line),lineBy:sim.lineBy.slice(),lineNo:sim.lineNo.slice(),hands:clone(sim.hands),talon:sim.talon.length,turn:sim.turn,result:sim.result?clone(sim.result):null});
  const frames=[frame(null)];
  for(const m of H.moves){
    if(sim.status!=='playing') break;
    if(m.k==='play'){ const i=sim.hands[m.seat].findIndex(x=>same(x,m.t)); if(i<0) break; play(sim,m.seat,i,m.side||'R'); }
    else noMove(sim,m.seat);
    frames.push(frame(m));
  }
  return frames;
}

/* ======================= AI ======================= */
/* The AI only ever sees what a player at the table sees: its own hand, the line,
   how many tiles everyone holds, the stock size, and who could not follow which number. */
function publicView(s,seat){
  return {n:s.n, teams:s.teams, seat, drawRule:s.drawRule||'until',
    hand:s.hands[seat].map(t=>[t[0],t[1]]), line:s.line.map(t=>[t[0],t[1]]),
    openTile:s.openTile?[s.openTile[0],s.openTile[1]]:null,
    counts:s.hands.map(h=>h.length), talonCount:s.talon.length, voids:(s.voids||[]).map(x=>x.slice())};
}
function viewLegal(v){ const hs=[]; hs[v.seat]=v.hand; return legal({hands:hs,line:v.line,openTile:v.openTile},v.seat); }
function aiChoose(v,level){
  const moves=viewLegal(v);
  if(moves.length<=1) return moves[0]||null;
  if(level==='facile') return moves[Math.floor(Math.random()*moves.length)];
  if(level==='difficile') return mcChoose(v,moves);
  return heuristicChoose(v,moves);
}
function endsAfter(v,m){
  const t=v.hand[m.i];
  if(!v.line.length) return [t[0],t[1]];
  let L=v.line[0][0], R=v.line[v.line.length-1][1];
  if(m.side==='L') L=(t[0]===L?t[1]:t[0]); else R=(t[0]===R?t[1]:t[0]);
  return [L,R];
}
/* Medium: get rid of heavy tiles and doubles, keep tiles that can follow,
   close the numbers the next opponent is missing, never those the partner is missing. */
function heuristicScore(v,m){
  const t=v.hand[m.i], [L,R]=endsAfter(v,m);
  let sc=t[0]+t[1]+(t[0]===t[1]?5:0);
  const rest=v.hand.filter((_,k)=>k!==m.i);
  sc+=2*Math.min(3,rest.filter(x=>x[0]===L||x[1]===L||x[0]===R||x[1]===R).length);
  for(let p=0;p<v.n;p++){
    if(p===v.seat) continue;
    const vd=v.voids[p]||[]; if(!(vd.includes(L)&&vd.includes(R))) continue;
    const mate=v.teams && p%2===v.seat%2;
    sc += mate ? -4 : (p===(v.seat+1)%v.n ? 5 : 2);
  }
  return sc;
}
function heuristicChoose(v,moves){
  let best=moves[0], bs=-1e9;
  for(const m of moves){ const sc=heuristicScore(v,m)+Math.random()*0.5; if(sc>bs){ bs=sc; best=m; } }
  return best;
}
/* Hard: Monte-Carlo. Deal the unseen tiles at random many times (respecting who is
   known to miss which number), play each candidate move to the end of the round with
   quick players, keep the move that scores best on average. */
function sampleWorld(v){
  const seen=new Set([...v.hand,...v.line].map(k2));
  const pool=shuffle(ALL.filter(t=>!seen.has(k2(t))).map(t=>[t[0],t[1]]));
  const hands=[]; hands[v.seat]=v.hand.slice();
  const others=[]; for(let p=0;p<v.n;p++) if(p!==v.seat) others.push(p);
  others.sort((a,b)=>(v.voids[b]||[]).length-(v.voids[a]||[]).length);
  for(const p of others){
    const vd=v.voids[p]||[], need=v.counts[p], got=[];
    for(let k=0;k<pool.length && got.length<need;){
      const t=pool[k];
      if(!vd.includes(t[0]) && !vd.includes(t[1])){ got.push(t); pool.splice(k,1); } else k++;
    }
    while(got.length<need && pool.length) got.push(pool.pop());
    hands[p]=got;
  }
  return {hands, talon:pool};
}
function quickPick(h,L,R){
  let bi=-1, bs=-1e9;
  for(let i=0;i<h.length;i++){ const t=h[i]; if(t[0]!==L&&t[1]!==L&&t[0]!==R&&t[1]!==R) continue;
    const sc=t[0]+t[1]+(t[0]===t[1]?5:0)+Math.random()*4; if(sc>bs){ bs=sc; bi=i; } }
  return bi;
}
function rollout(v,hands,talon,L,R,p){
  const until=v.drawRule==='until';
  const fits=t=>t[0]===L||t[1]===L||t[0]===R||t[1]===R;
  const anyCan=()=>hands.some(h=>h.some(fits));
  for(let guard=0;guard<500;guard++){
    const h=hands[p];
    let bi=quickPick(h,L,R);
    if(bi<0 && talon.length){
      if(until){ do{ h.push(talon.pop()); } while(talon.length && !fits(h[h.length-1])); if(fits(h[h.length-1])) bi=h.length-1; }
      else h.push(talon.pop());
    }
    if(bi>=0){
      const t=h.splice(bi,1)[0], fl=t[0]===L||t[1]===L, fr=t[0]===R||t[1]===R;
      const sd= fl&&fr ? (Math.random()<.5?'L':'R') : (fl?'L':'R');
      if(sd==='L') L=(t[0]===L?t[1]:t[0]); else R=(t[0]===R?t[1]:t[0]);
      if(!h.length) return {kind:'domino',last:p};

function outcome(v,hands,res){

  else { const min=Math.min(...pips), ws=[]; pips.forEach((x,q)=>{ if(x===min) ws.push(q); }); if(new Set(ws.map(g)).size===1) w=ws[0]; }
  if(w===null) return 0;

function simValue(v,w,m){
  const hands=w.hands, talon=w.talon, me=v.seat;

  else { L=v.line[0][0]; R=v.line[v.line.length-1][1]; if(m.side==='L') L=(t[0]===L?t[1]:t[0]); else R=(t[0]===R?t[1]:t[0]); }
  let res;
  if(!hands[me].length) res={kind:'domino',last:me};
  else {
    const fits=x=>x[0]===L||x[1]===L||x[0]===R||x[1]===R;
    res = (!talon.length && !hands.some(h=>h.some(fits))) ? {kind:'blocked',last:me} : rollout(v,hands,talon,L,R,(me+1)%v.n);

const AI_BUDGET={ms:220, min:60, max:1500};
const clock=()=>(typeof performance!=='undefined'&&performance.now)?performance.now():Date.now();
function mcChoose(v,moves){
  const t0=clock(), tot=new Array(moves.length).fill(0);
  let it=0;
  while(it<AI_BUDGET.max && (it<AI_BUDGET.min || clock()-t0<AI_BUDGET.ms)){
    const w=sampleWorld(v);
    for(let k=0;k<moves.length;k++) tot[k]+=simValue(v,{hands:w.hands.map(h=>h.slice()),talon:w.talon.slice()},moves[k]);
    it++;
  }
  let b=0; for(let k=1;k<moves.length;k++) if(tot[k]>tot[b]) b=k;
  return moves[b];
}
/* ---- Fermer le jeu : à 2 contre 2, on demande d'abord à son partenaire ----

   partenaire a encore plus d'un domino, le partenaire décide : d'accord (le coup est joué)
   ou non (le joueur doit jouer un autre domino). */
const partnerOf=(s,p)=>s.teams?(p+2)%4:-1;
function wouldBlock(s,seat,i,side){
  if(!s.teams || s.talon.length) return false;

/* The moves a player may make now (without the blocking ones once the partner said no). */
function movesFor(s,seat){
  const ms=legal(s,seat);
  if(!noBlockFor(s,seat)) return ms;
  const ok=ms.filter(m=>!wouldBlock(s,seat,m.i,m.side));
  return ok.length?ok:ms;
}
function needAsk(s,seat,i,side){
  if(!s.teams || s.status!=='playing' || noBlockFor(s,seat)) return false;
  const p2=partnerOf(s,seat);
  if(s.hands[p2].length<=1) return false;
  if(!wouldBlock(s,seat,i,side)) return false;
  return legal(s,seat).some(o=>!wouldBlock(s,seat,o.i,o.side));
}

  if(yes){ const i=s.hands[a.seat].findIndex(x=>same(x,a.t)); if(i>=0 && legal(s,a.seat).some(m=>m.i===i && m.side===a.side)){ play(s,a.seat,i,a.side); return; } }

/* Ask (or, when the partner is the AI, get the answer at once). */

  ev(s,{k:'ask',seat,t:[t[0],t[1]]});
  if(isBot(s.seats[p2]) || !s.seats[p2]) resolveAsk(s,aiAgree(s,p2),false);
}
/* One full turn for an AI seat. */
function botTurn(s,t){
  const lv=s.level||'moyen';
  let mv=aiChoose(publicView(s,t),lv);
  if(mv){ botPlay(s,t,mv); return; }

function botPlay(s,t,mv){
  if(s.teams && wouldBlock(s,t,mv.i,mv.side)){
    const alts=legal(s,t).filter(o=>!wouldBlock(s,t,o.i,o.side));
    if(alts.length){
      // time ran out for a human, or the partner already said no: don't block
      if(s._auto || noBlockFor(s,t)){ mv=heuristicChoose(publicView(s,t),alts); }
      else if(s.hands[partnerOf(s,t)].length>1){ startAsk(s,t,mv.i,mv.side); return; }
    }
  }
  play(s,t,mv.i,mv.side);

/* ======================= Board layout ======================= */
/* Lays the line out like on a real table: from the first tile, the right arm runs
   right, turns down at the edge (one tile across the corner) and comes back left,
   and so on; the left arm runs left and turns up. Every tile touches its neighbour
   with the matching number. Returns tiles in px (y relative to the first tile's row)
   and where each open end is.
   line: tiles in order from the left end to the right end; i0: index of the first tile placed. */
function snakeLayout(line,i0,u,W,gp,B=22){
  const out=[], P=2*u+gp, ends={}, room=Math.max(u,B);   // room kept at each edge for a corner tile or the end marker
  const t0=line[i0], d0=t0[0]===t0[1];
  const w0=d0?u:2*u, h0=d0?2*u:u, x0=Math.max(0,Math.round(W/2-w0/2));
  out.push({idx:i0,x:x0,y:-h0/2,w:w0,h:h0,a:t0[0],b:t0[1],v:d0,kind:d0?'perp':'straight'});
  for(const dir of [1,-1]){
    // dir 1: right arm (towards the right end of the line), rows go down
    // dir -1: left arm (towards the left end), rows go up
    let right = dir===1, y=0, afterTurn=false;
    let cur = dir===1 ? x0+w0+gp : x0-gp;       // going right: left edge of the next tile; going left: its right edge
    let last = {x:x0,y:-h0/2,w:w0,h:h0,turn:false};
    for(let k=i0+dir; k>=0 && k<line.length; k+=dir){
      const t=line[k];
      const entry= dir===1 ? t[0] : t[1], exit= dir===1 ? t[1] : t[0];
      const perp = t[0]===t[1] && !afterTurn;
      const w= perp?u:2*u, h= perp?2*u:u;
      const fits = right ? (cur+w+gp+room<=W) : (cur-w-gp-room>=0);
      if(fits){
        const x= right ? cur : cur-w;
        out.push({idx:k,x,y:y-h/2,w,h,a:right?entry:exit,b:right?exit:entry,v:perp,kind:perp?'perp':'straight'});
        cur = right ? cur+w+gp : cur-w-gp;
        last={x,y:y-h/2,w,h,turn:false}; afterTurn=false;
      } else {
        // corner: the tile stands across, one half on this row, the other towards the next row
        const x= right ? cur : cur-u;
        const ty= dir===1 ? y-u/2 : y-1.5*u;
        out.push({idx:k,x,y:ty,w:u,h:2*u,a:dir===1?entry:exit,b:dir===1?exit:entry,v:true,kind:'turn'});
        y+= dir===1 ? P : -P;
        cur = right ? x+u : x;
        right = !right; afterTurn=true;
        last={x,y:ty,w:u,h:2*u,turn:true};
      }
    }
    // where the next tile would go on this arm
    let bx,by;
    if(last.turn){ bx=last.x+last.w/2; by= dir===1 ? last.y+last.h+gp+B/2 : last.y-gp-B/2; }
    else if(right){ bx=last.x+last.w+gp+B/2; by=last.y+last.h/2; }
    else { bx=last.x-gp-B/2; by=last.y+last.h/2; }
    ends[dir===1?'R':'L']={x:bx,y:by,r:B/2};
  }
  return {tiles:out, ends};
}

  const c=audio(); if(!c) return;
  const t=c.currentTime+(when||0), o=c.createOscillator(), g=c.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(gain||.12,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);

function clack(when){                    // a domino landing on the table
  const c=audio(); if(!c) return;
  const t=c.currentTime+(when||0), len=Math.floor(c.sampleRate*0.05), buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,5);

  src.buffer=buf; f.type='bandpass'; f.frequency.value=2200; f.Q.value=1.1; g.gain.value=1.1;

}

/* Every change to a table goes through here: read the latest version,
   apply the change to it, write it back. The mutator returns false to cancel.
   With lock=true (actions several people can do at once: seats, start,
   next round…) the table's short lease is taken first, retrying for a few
   seconds, so simultaneous clicks are applied one after the other.
   Turn moves skip the lease so play stays fluid; they are guarded by the
   version check in act() instead.
   A page runs its changes one at a time, in click order. */
let txChain=Promise.resolve();
function transact(mutate, lock=true){
  const run=()=>runTx(mutate,lock);
  const p=txChain.then(run,run);
  txChain=p.catch(()=>{});
  return p;
}
async function runTx(mutate, lock){
  if(localMode){
    if(!state) return false;
    const s=clone(state); if(mutate(s)===false) return false;
    s.v=(state.v||0)+1; s.updatedAt=Date.now(); onState(s); return true;
  }
  if(!db || !code) return false;
  const c=code, ref=db.doc('tables/'+c);
  try{
    if(lock){
      const until=Date.now()+7000;
      while(true){
        // stop early if the latest table we have already makes this change pointless
        if(code!==c || !state || mutate(clone(state))===false) return false;
        const l=await ref.acquire({holder:me+':'+TAB,ttlMs:1000});
        if(l.acquired) break;
        if(Date.now()>until){ toast(knownWriter() ? 'La table est occupée, réessayez.' : 'Impossible de modifier la table. Si ça continue, voyez « Comment inviter des amis à jouer ».'); return false; }
        await sleep(150+Math.random()*250);
      }
    }
    const snap=await ref.get();
    if(!snap.exists){ toast('Cette table n’existe plus.'); return false; }
    const s=norm(clone(snap.data()));
    if(mutate(s)===false) return false;
    s.v=(s.v||0)+1; s.updatedAt=Date.now(); s.w=me+':'+TAB;
    await ref.set(s); return true;
  }catch(e){ writeError(e); return false; }
}

  else if(e && e.code==='quota_exceeded') toast("Trop de tables enregistrées. Supprimez-en avant d'en créer une nouvelle.");
  else toast("Connexion perdue, réessayez dans un instant.");
}

function subscribeLobby(){
  if(!db || unsubLobby) return;
  unsubLobby=db.collection('tables').orderBy('updatedAt','desc').limit(40).onSnapshot(snap=>{
    lobbyDocs=snap.docs.map(d=>d.data()); renderLobbyLists();
    refreshNames(lobbyDocs.flatMap(d=>d.seats||[]));
  }, e=>{ const el=document.getElementById('lobby-state'); if(el) el.textContent='Liste indisponible'; });
}
function renderLobbyLists(){
  const box=document.getElementById('tables'); if(!box) return;
  const st=document.getElementById('lobby-state');
  if(!booted){ st.textContent='Connexion…'; box.replaceChildren(h('p',{class:'muted',text:'Chargement des tables…'})); return; }
  if(!db){ st.textContent='Hors ligne'; box.replaceChildren(h('p',{class:'muted',text:'Aucune table en ligne dans cette vue.'})); return; }
  const now=Date.now(), fresh=d=>now-(d.updatedAt||0)<6*3600e3 && d.seats?.some(x=>x && !isBot(x));
  const mine=lobbyDocs.filter(d=>d.seats?.includes(me) && d.status!=='over');
  const open=lobbyDocs.filter(d=>d.status==='waiting' && !d.seats?.includes(me) && fresh(d));
  const live=lobbyDocs.filter(d=>(d.status==='playing'||d.status==='roundEnd') && !d.seats?.includes(me) && fresh(d));
  const total=mine.length+open.length+live.length;
  st.textContent=`${total} table${total>1?'s':''}`;
  const row=(d,label,primary)=>{
    const n=d.seats.filter(x=>x && !isBot(x)).length;
    const status=d.status==='waiting'?`${d.seats.filter(Boolean).length}/4 places prises`:d.status==='playing'?`Manche ${d.round} en cours · ${n} joueur${n>1?'s':''}`:`Manche ${d.round} terminée`;
    const people=d.seats.filter(x=>x && !isBot(x)).map(x=> x===me ? 'Vous' : (d.nicks&&d.nicks[x]) || names[x] || 'Joueur');
    const ais=d.seats.filter(isBot).length;
    const who=people.join(', ')+(ais?` + ${ais} IA`:'');
    return h('div',{class:'trow'},
      h('span',{class:'code',text:d.code}),
      h('span',{class:'grow'},h('span',{text:status}),h('span',{class:'muted',text:` · ${d.scores[0]} – ${d.scores[1]}`}),who?h('span',{class:'who',text:who}):null),
      h('button',{class:'btn small'+(primary?'':' ghost'),onclick:()=>openTable(d.code),text:label}));
  };
  const kids=[];
  if(mine.length){ kids.push(h('span',{class:'eyebrow',text:'Vos tables'})); mine.forEach(d=>kids.push(row(d,'Reprendre',true))); }
  if(open.length){ kids.push(h('span',{class:'eyebrow',text:'En attente de joueurs'})); open.forEach(d=>kids.push(row(d,'Voir',false))); }
  if(live.length){ kids.push(h('span',{class:'eyebrow',text:'Parties en cours'})); live.forEach(d=>kids.push(row(d,'Regarder',false))); }
  if(!kids.length) kids.push(h('p',{class:'muted',text:'Aucune table ouverte pour l’instant. Créez-en une.'}));
  box.replaceChildren(...kids);
}
async function createTable(){
  if(!db) return;
  if(!requireNick()) return;
  const L='ABCDEFGHJKLMNPQRSTUVWXYZ';
  for(let tries=0;tries<5;tries++){
    const c=Array.from({length:4},()=>L[Math.floor(Math.random()*L.length)]).join('');
    try{
      const ref=db.doc('tables/'+c); const ex=await ref.get(); if(ex.exists) continue;
      const t=newTable(c,me,{turnSecs:30}); withNick(t); await ref.set(t); openTable(c); return;
    }catch(e){ writeError(e); return; }
  }
  toast('Impossible de créer la table, réessayez.');
}
function startLocal(){
  if(!requireNick()) return;
  const m=AI_MODES.find(x=>x.id===aiPick.mode)||AI_MODES[2];
  unsubTable&&unsubTable(); unsubTable=null;
  localMode=true; code='LOCAL'; selected=null; pendingIdx=null; lastLineLen=0; myDrawn=null; state=null; dropReplay();
  const s=newTable('LOCAL',me,{n:m.n,teams:m.teams,level:aiPick.level,drawRule:aiPick.drawRule,turnSecs:aiPick.turnSecs});
  s.seats=[me,...Array.from({length:m.n-1},(_,k)=>'bot'+(k+1))];
  deal(s); onState(s); SFX.deal();
}

function openTable(c){
  if(!db){ toast('Le jeu en ligne n’est pas disponible ici.'); return; }
  localMode=false; code=c; state=null; selected=null; pendingIdx=null; lastLineLen=0; quitArmed=false; myDrawn=null; dropReplay();
  try{ history.replaceState(null,'','#'+c); }catch(e){}
  unsubTable&&unsubTable();
  if(unsubLobby){ unsubLobby(); unsubLobby=null; }   // one subscription per table, so no copy arrives twice
  const app=document.getElementById('app'); app.replaceChildren(h('p',{class:'muted',text:'Ouverture de la table '+c+'…'}));
  unsubTable=db.doc('tables/'+c).onSnapshot(snap=>{
    if(code!==c) return;
    if(!snap.exists){ state=null; const ok=knownWriter();
      app.replaceChildren(h('div',{class:'card'},h('h2',{text:'Table introuvable'}),
        h('p',{class:'muted',text: ok ? `Aucune table ne porte le code ${c}. Vérifiez les lettres.` : `Aucune table visible ne porte le code ${c}. Vérifiez les lettres ; si le code est bon, votre compte n’a pas accès aux parties en ligne de cette page.`}),
        ok ? null : accessHelp(true),
        h('div',{class:'row'},h('button',{class:'btn',onclick:leaveView,text:'Retour au salon'})))); return; }
    onState(norm(clone(snap.data())));
  }, e=>toast('Connexion à la table perdue. Rechargez la page.'));
}
function leaveView(){
  unsubTable&&unsubTable(); unsubTable=null; localMode=false; code=null; quitArmed=false;
  try{ history.replaceState(null,'',location.pathname); }catch(e){}
  renderLobby();
}
function onState(s){
  if(state && !localMode && s.code===state.code && (s.v||0)<(state.v||0)) return;   // never go back in time
  const changed=!state || state.v!==s.v, prev=state;
  if(state && s.round!==state.round) myDrawn=null;
  const key= s.status==='playing' ? `${s.round}:${s.moveNo}:${s.turn}:${s.ask?'a':''}:${s.noBlock?s.noBlock.n:''}` : null;
  if(key!==turnKey){ turnKey=key; turnSeenAt=Date.now(); lastTickSec=null; }
  state=s;
  if(changed) playSounds(prev,s);
  if(changed) pendingIdx=null;
  if(selected!=null && (state.status!=='playing' || state.turn!==mySeat())) selected=null;
  renderTable(); schedule();
  if(changed && prev && prev.code===s.code) afterChange(prev,s);
  if(s.status==='over') recordStats(s);
  refreshNames(state.seats);
  // a table where I sit without a name gets mine (a name already there is only changed on purpose: "Enregistrer" or sitting down)
  if(!localMode && db && myNick && s.seats.includes(me) && !(s.nicks||{})[me] && nickSynced!==code){
    nickSynced=code;
    transact(x=>{ if(!x.seats.includes(me) || (x.nicks||{})[me]) return false; x.nicks={...(x.nicks||{}),[me]:myNick}; });
  }
}

/* Automatic moves: the AI seats (driven by the seated humans, first one first,
   the others as backup), forced draws/passes, and passes for an absent player. */
function schedule(){
  clearTimeout(actTimer); clearTimeout(staleTimer); clearTimeout(limitTimer);
  if(!state || state.status!=='playing') return;
  const s0=state, t=s0.turn, who=s0.seats[t], v=s0.v, my=mySeat();
  if(retryV!==v){ retryV=v; retries=0; }
  const humans=s0.seats.map((x,p)=>x && !isBot(x)?p:-1).filter(p=>p>=0);
  if(s0.ask){
    // the partner answers; if nobody does within 25 s, the AI answers for them
    const p2=partnerOf(s0,s0.ask.seat);
    if(my>=0){
      const extra= my===p2 ? 0 : 2500+Math.max(0,humans.indexOf(my))*1500;
      actTimer=setTimeout(()=>{ if(state && state.v===v) act(v,s=>{ if(!s.ask) return false; resolveAsk(s,aiAgree(s,p2),true); }); },
        Math.max(0,(s0.ask.at||Date.now())+25000-Date.now())+extra);
    }
    return;
  }
  const noMoveJob=s=>{ if(s.turn!==t || canPlay(s,t)) return false; noMove(s,t); };
  let delay=null, job=null;
  if(who===me){
    if(!canPlay(s0,t)){ delay=1400; job=s=>{
      if(s.turn!==t || canPlay(s,t)) return false;
      const before=new Set(s.hands[t].map(k2)); noMove(s,t);
      const drawn=s.hands[t].map(k2).filter(x=>!before.has(x)); myDrawn=drawn.length?new Set(drawn):null; }; }
  } else if(my>=0 && isBot(who)){
    delay=speedMs()+humans.indexOf(my)*3500+Math.random()*300;
    job=s=>{ if(s.turn!==t || !isBot(s.seats[t])) return false; botTurn(s,t); };
  } else if(my>=0 && who && !canPlay(s0,t)){
    delay=4000+humans.filter(p=>p!==t).indexOf(my)*2500; job=noMoveJob;
  }
  if(job && retries<4) actTimer=setTimeout(async()=>{
    if(!state || state.v!==v || !code) return;
    const ok=await act(v,s=>s.status==='playing'?job(s):false);
    if(!ok && state && state.v===v){ retries++; schedule(); }
  }, delay);
  if(!s0.turnSecs && my>=0 && who && !isBot(who) && who!==me){
    const left=STALE_MS-(Date.now()-(s0.updatedAt||0));
    if(left>0) staleTimer=setTimeout(()=>{ if(state && state.v===v) renderTable(); }, left+300);
  }
  // time limit: when it runs out the AI plays this one move for the player
  // (the player's own page first; the other players' pages a little later, in case theirs is closed)
  if(s0.turnSecs>0 && my>=0 && who && !isBot(who)){
    const extra= who===me ? 0 : 3000+Math.max(0,humans.filter(p=>p!==t).indexOf(my))*2000;
    limitTimer=setTimeout(async()=>{
      if(!state || state.v!==v || !code || state.status!=='playing') return;
      if(who===me) selected=null;
      const done=await act(v,s=>{ if(s.status!=='playing' || s.turn!==t || s.seats[t]!==who) return false; s._auto=true; botTurn(s,t); delete s._auto; });
      if(done && who===me) toast('Temps écoulé : l’IA a joué à votre place.');
    }, Math.max(0,turnSeenAt+s0.turnSecs*1000-Date.now()+extra));
  }
}

/* ---- player actions ---- */
function sit(seat){ if(!requireNick()) return Promise.resolve(false); return transact(s=>{
  if(s.status!=='waiting'){ toast('La partie a déjà commencé.'); return false; }
  if(s.seats[seat]){ toast('Cette place est prise.'); return false; }
  s.seats=s.seats.map(x=>x===me?null:x); s.seats[seat]=me; withNick(s); }); }
function setBot(seat,on){ return transact(s=>{
  if(s.status!=='waiting' || !s.seats.includes(me)) return false;
  if(on){ if(s.seats[seat]) return false; s.seats[seat]='bot'+seat; }
  else { if(!isBot(s.seats[seat])) return false; s.seats[seat]=null; } }); }
function setLevel(lv){ return transact(s=>{ if(s.status!=='waiting' || !s.seats.includes(me) || s.level===lv) return false; s.level=lv; }); }
function setTurnSecs(v){ return transact(s=>{ if(s.status!=='waiting' || !s.seats.includes(me) || s.turnSecs===v) return false; s.turnSecs=v; }); }
function startGame(fill){ return transact(s=>{
  if(s.status!=='waiting' || !s.seats.includes(me)) return false;
  if(fill) s.seats=s.seats.map((x,i)=>x||('bot'+i));
  if(s.seats.some(x=>!x)){ toast('Il faut 4 joueurs.'); return false; }
  s.scores=s.scores.map(()=>0); s.round=0; s.lastWinner=null; s.events=[]; deal(s); }); }
function nextRound(){ return transact(s=>{ if(s.status!=='roundEnd') return false; deal(s); }); }
function newGame(){ return transact(s=>{ if(s.status!=='over') return false; s.scores=s.scores.map(()=>0); s.round=0; s.lastWinner=null; s.events=[]; deal(s); }); }
function takeSeat(p){ if(!requireNick()) return Promise.resolve(false); return transact(s=>{
  if(s.seats.includes(me)) return false;
  if(!isBot(s.seats[p])){ toast('Cette place vient d’être prise.'); return false; }
  s.seats[p]=me; withNick(s); }); }
function replaceAbsent(p){ return act(state.v,s=>{
  if(s.status!=='playing' || s.turn!==p) return false;
  const id=s.seats[p]; if(!id || isBot(id) || id===me) return false;
  s.seats[p]='bot'+p; },true); }
async function leaveTable(){
  const my=mySeat();
  if(localMode || my<0){ leaveView(); return; }
  if(state.status!=='waiting' && !quitArmed){
    quitArmed=true; renderTable(); clearTimeout(quitTimer);
    quitTimer=setTimeout(()=>{ quitArmed=false; if(code && state) renderTable(); },5000); return;
  }
  quitArmed=false;
  await transact(s=>{ const p=s.seats.indexOf(me); if(p<0) return false; s.seats[p]= s.status==='waiting'? null : 'bot'+p; });
  leaveView();
}
function clickTile(i){
  const my=mySeat();
  if(pendingIdx!=null || state.status!=='playing' || state.turn!==my) return;
  const mv=movesFor(state,my).filter(m=>m.i===i);
  if(state.ask) return;
  if(!mv.length){ const b=document.querySelector(`[data-i="${i}"]`); if(b){ b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); } return; }
  if(mv.length===1){ selected=null; doPlay(i,mv[0].side); return; }
  selected = selected===i ? null : i; renderTable();
}
async function doPlay(i,side){
  const my=mySeat(), v=state.v, t=state.hands[my][i];
  pendingIdx=i; myDrawn=null; renderTable();
  let asked=false;
  const ok=await act(v,s=>{
    if(s.status!=='playing' || s.turn!==my || s.ask) return false;
    const x=s.hands[my][i]; if(!x || x[0]!==t[0] || x[1]!==t[1]) return false;
    if(!movesFor(s,my).some(m=>m.i===i && m.side===side)) return false;
    if(needAsk(s,my,i,side)){ asked=true; startAsk(s,my,i,side); return; }
    play(s,my,i,side);
  });
  if(!ok && state && state.v===v){ pendingIdx=null; renderTable(); }
}
function playSide(side){ const i=selected; selected=null; doPlay(i,side); }
function answerAsk(yes){
  const v=state.v, my=mySeat();
  return act(v,s=>{ if(!s.ask || partnerOf(s,s.ask.seat)!==my) return false; resolveAsk(s,yes,false); });
}

function evText(e){
  const you=e.seat!=null && state.seats[e.seat]===me;
  const n=e.seat!=null?nameOf(e.seat):'';
  const V=(a,b)=>you?b:a;
  switch(e.k){
    case 'deal': return `Manche ${e.r} : ${n} ${V('ouvre','ouvrez')}${e.o?' avec '+tileName(e.o):e.d6?' avec le double 6':''}.`;
    case 'play': return `${n} ${V('pose','posez')} ${e.t[0]}|${e.t[1]}${e.auto?' (temps écoulé)':''}.`;
    case 'pass': return `${n} ${V('passe','passez')}.`;
    case 'draw': return `${n} ${V('pioche','piochez')} ${e.c} domino${e.c>1?'s':''}.`;
    case 'domino': return `${n} ${V('fait','faites')} domino ! +${e.pts}`;
    case 'ask': return `${n} ${V('demande','demandez')} à son partenaire s’il peut fermer le jeu.`;
    case 'askYes': return `Partenaire de ${n} : d’accord pour fermer${e.auto?' (réponse auto)':''}.`;
    case 'askNo': return `Partenaire de ${n} : refuse de fermer${e.auto?' (réponse auto)':''}.`;
    case 'blocked': return e.seat==null?'Partie bloquée, égalité : personne ne marque.':`Partie bloquée : ${n} ${V('est','êtes')} le plus léger. +${e.pts}`;
  }
  return '';
}

/* The other players around me, left to right, with where they sit. */
function around(s,base){
  const at=off=>(base+off)%s.n;
  if(s.n===2) return [[at(1),'En face']];
  if(s.n===3) return [[at(2),'Gauche'],[at(1),'Droite']];
  return [[at(3),'Gauche'],[at(2),s.teams?'Partenaire':'En face'],[at(1),'Droite']];
}
function playerChip(p,label){

const colorVar=(s,p)=> s.teams ? (p%2===0?'var(--ochre)':'var(--coral)') : `var(--p${p})`;
function whoLabel(s,p){ const my=mySeat(); return nameOf(p)+(my>=0 && s.teams && p!==my && p%2===my%2 ? ' (partenaire)' : ''); }
const sideText=sd=> sd==='L'?'à gauche' : sd==='R'?'à droite' : '';
const whereText=a=> a.on!=null ? `sur le ${a.on}` : sideText(a.side);   // older moves have no "on" 
/* A player's last action this round, shown on their card. */
function actLine(s,p){
  const a=s.last && s.last[p]; if(!a) return null;
  const row=h('div',{class:'lastact'});
  if(a.k==='play'){
    row.append(h('span',{text: a.drew ? `a pioché ${a.drew}, puis posé` : (a.side?'a posé':'a ouvert avec')}), tileEl(a.t[0],a.t[1],{cls:'mini'}));
    if(a.side) row.append(h('span',{text:whereText(a)}));
  } else if(a.k==='pass') row.append(h('span',{text:'a passé'}));
  else row.append(h('span',{text:`a pioché ${a.c} domino${a.c>1?'s':''}`}));
  if(a.auto) row.append(h('span',{class:'tag',text:'temps écoulé'}));
  return row;
}
/* What happened since my last move (or since the deal), oldest first. */
function recapEvents(s,my){
  const evs=s.events||[], out=[];
  if(my<0) return evs.slice(-5);
  for(let i=evs.length-1;i>=0;i--){
    const e=evs[i];
    if(e.seat===my && (e.k==='play'||e.k==='pass'||e.k==='draw')){ if(e.auto) out.unshift(e); break; }   // show my move if the timer played it
    out.unshift(e);
    if(e.k==='deal') break;
  }
  if(out.length>1 && out[0].k==='deal' && out[1].k==='play' && out[1].seat===out[0].seat) out.shift();
  return out;
}
function recapRow(s,e){
  const p=e.seat, you=p!=null && s.seats[p]===me, nm=p!=null?whoLabel(s,p):'';
  const dot=p!=null?h('span',{class:'teamdot '+colorOf(s,p)}):null;
  const tag=e.auto?h('span',{class:'tag',text:'temps écoulé'}):null;
  if(e.k==='play') return h('li',{class:'rrow'},dot,h('span',{text:`${nm} ${you?'posez':'pose'}`}),tileEl(e.t[0],e.t[1],{cls:'mini'}),h('span',{class:'muted',text: e.side===null?'pour ouvrir':whereText(e)}),tag);
  if(e.k==='pass') return h('li',{class:'rrow'},dot,h('span',{text:`${nm} ${you?'passez':'passe'}`}),tag);
  if(e.k==='draw') return h('li',{class:'rrow'},dot,h('span',{text:`${nm} ${you?'piochez':'pioche'} ${e.c} domino${e.c>1?'s':''}`}),tag);
  return h('li',{class:'rrow note'},dot,h('span',{text:evText(e)}));
}
function recapBox(s,marked){

let resizeTimer=null;
function layoutSnakes(){ document.querySelectorAll('.snake').forEach(drawSnake); }
function drawSnake(box){
  if(!box._ctx) return;
  const {line,i0,marks,choose,ends}=box._ctx;
  const u=parseFloat(getComputedStyle(box).getPropertyValue('--u'))||20, W=box.clientWidth, gp=3;
  if(!W) return;
  const lay=snakeLayout(line,i0,u,W,gp);
  let minY=Infinity, maxY=-Infinity;
  for(const t of lay.tiles){ minY=Math.min(minY,t.y); maxY=Math.max(maxY,t.y+t.h); }
  for(const k of ['L','R']){ const e=lay.ends[k]; minY=Math.min(minY,e.y-e.r); maxY=Math.max(maxY,e.y+e.r); }
  box.style.height=Math.ceil(maxY-minY)+'px';
  const kids=lay.tiles.map(t=>{ const m=marks[t.idx]||{};
    const el=tileEl(t.a,t.b,{v:t.v,cls:m.cls||'',style:(m.style?m.style+';':'')+`left:${t.x}px;top:${t.y-minY}px`});
    el.dataset.k=t.idx; return el; });
  for(const k of ['L','R']){
    const e=lay.ends[k], val=ends[k];
    const pos=`left:${e.x-e.r}px;top:${e.y-e.r-minY}px;width:${2*e.r}px;height:${2*e.r}px`;
    kids.push(choose ? h('button',{type:'button',class:'endmark pick',style:pos,title:`Poser sur le ${val}`,'aria-label':`Poser sur le ${val}`,onclick:()=>playSide(k),text:String(val)})
                     : h('span',{class:'endmark',style:pos,'aria-label':`Bout ouvert : ${val}`,text:String(val)}));
  }
  box.replaceChildren(...kids);
}
window.addEventListener('resize',()=>{ clearTimeout(resizeTimer); resizeTimer=setTimeout(layoutSnakes,120); });

/* ======================= Revoir la manche ======================= */
function dropReplay(){ if(replay){ clearTimeout(replay.timer); replay=null; } }
function openReplay(){
  const fr=buildFrames(state);
  if(!fr || fr.length<2){ toast('Rien à revoir pour cette manche.'); return; }
  replay={frames:fr,i:0,playing:true,round:state.round,openTile:state.hist.openTile,timer:null};
  selected=null; renderTable(); window.scrollTo(0,0); runReplay();
}
function closeReplay(){ dropReplay(); if(state) renderTable(); }
function runReplay(){
  if(!replay) return; clearTimeout(replay.timer);
  if(!replay.playing) return;
  if(replay.i>=replay.frames.length-1){ replay.playing=false; renderTable(); return; }
  replay.timer=setTimeout(()=>{ if(!replay) return; replay.i++;
    const m=replay.frames[replay.i].move; if(m && m.k==='play') SFX.place(); else if(m && m.k==='draw') SFX.draw();
    renderTable(); runReplay(); },1300);
}
function gotoReplay(j){
  if(!replay) return; j=Math.max(0,Math.min(replay.frames.length-1,j)); if(j===replay.i) return;
  const fwd=j===replay.i+1; replay.i=j; replay.playing=false; clearTimeout(replay.timer);
  const m=replay.frames[j].move; if(fwd && m && m.k==='play') SFX.place();
  renderTable();
}
function toggleReplay(){ if(!replay) return; replay.playing=!replay.playing; if(replay.playing && replay.i>=replay.frames.length-1) replay.i=0; renderTable(); runReplay(); }
document.addEventListener('keydown',e=>{
  if(!replay) return;
  const tg=e.target; if(tg && ['INPUT','TEXTAREA','BUTTON','SELECT'].includes(tg.tagName)) return;
  if(e.key==='ArrowRight'){ gotoReplay(replay.i+1); e.preventDefault(); }
  else if(e.key==='ArrowLeft'){ gotoReplay(replay.i-1); e.preventDefault(); }
  else if(e.key===' '){ toggleReplay(); e.preventDefault(); }
  else if(e.key==='Escape') closeReplay();
});
function renderReplay(s){
  const R=replay, f=R.frames[R.i], N=R.frames.length-1, m=f.move, out=[];
  out.push(h('div',{class:'rp-head'},h('h2',{text:`Revoir la manche ${R.round}`}),h('button',{class:'btn small',onclick:closeReplay,text:'Revenir à la partie'})));
  if(state.round!==R.round && state.status==='playing')
    out.push(h('p',{class:'rp-note',text: state.turn===mySeat() ? 'La manche suivante a commencé et c’est à vous de jouer.' : 'La manche suivante a commencé.'}));
  // what happens at this step
  const row=h('div',{class:'rrow'});
  if(!m){ const o=f.turn; row.append(h('span',{class:'teamdot '+colorOf(s,o)}),h('span',{text:`${whoLabel(s,o)} ${s.seats[o]===me?'ouvrez':'ouvre'} la manche${R.openTile?' avec '+tileName(R.openTile):''}.`})); }
  else {
    const p=m.seat, you=s.seats[p]===me, nm=whoLabel(s,p);
    row.append(h('span',{class:'teamdot '+colorOf(s,p)}));
    if(m.k==='play') row.append(h('span',{text:`${nm} ${you?'posez':'pose'}`}),tileEl(m.t[0],m.t[1],{cls:'mini'}),h('span',{class:'muted',text:m.side===null?'pour ouvrir':(m.on!=null?`sur le ${m.on}`:'')}));
    else if(m.k==='draw') row.append(h('span',{text:`${nm} ${you?'piochez':'pioche'} ${m.c} domino${m.c>1?'s':''}`}));
    else row.append(h('span',{text:`${nm} ${you?'passez':'passe'}`}));
    if(m.auto) row.append(h('span',{class:'tag',text:'temps écoulé'}));
  }
  const cap=h('div',{class:'rp-cap'},h('span',{class:'lab',text: R.i===0?'Distribution':`Coup ${R.i} sur ${N}`}),row);
  if(f.result){ const r=f.result, w=r.winner, you=w!=null && s.seats[w]===me;
    cap.append(h('p',{class:'rp-end',text: w==null ? 'Partie bloquée\u00a0: égalité, personne ne marque.' : r.kind==='domino' ? `${nameOf(w)} ${you?'faites':'fait'} domino\u00a0! +${r.pts}` : `Partie bloquée\u00a0: ${nameOf(w)} ${you?'êtes':'est'} le plus léger. +${r.pts}`})); }
  out.push(cap);
  // controls
  const T=x=>x+'\uFE0E';
  out.push(h('div',{class:'rp-ctl'},
    h('button',{class:'btn ghost small',onclick:()=>gotoReplay(0),disabled:R.i===0,text:'Début'}),
    h('button',{class:'btn ghost small',onclick:()=>gotoReplay(R.i-1),disabled:R.i===0,text:T('◀')+' Précédent'}),
    h('button',{class:'btn small',onclick:toggleReplay,text:R.playing?'Pause':'Lecture'}),
    h('button',{class:'btn ghost small',onclick:()=>gotoReplay(R.i+1),disabled:R.i===N,text:'Suivant '+T('▶')}),
    h('button',{class:'btn ghost small',onclick:()=>gotoReplay(N),disabled:R.i===N,text:'Fin'}),
    h('input',{type:'range',class:'rp-range',min:'0',max:String(N),value:String(R.i),'aria-label':'Aller au coup',onchange:e=>gotoReplay(+e.target.value)})));
  // the table at this step
  const board=h('div',{class:'board'+(f.line.length>16?' dense':'')});
  if(f.line.length){
    const nos=f.lineNo, i0=nos.indexOf(Math.min(...nos)), latest=Math.max(...nos);
    const marks=f.line.map((t,idx)=> m && m.k==='play' && nos[idx]===latest ? {cls:'mark latest',style:`--mc:${colorVar(s,f.lineBy[idx])}`} : {});
    const L=f.line[0][0], Rv=f.line[f.line.length-1][1];
    board.append(h('div',{class:'endinfo'},h('span',{text:`Bouts ouverts : ${L} et ${Rv}`}), s.n<4 ? h('span',{class:'stock'},tileEl(0,0,{v:true,back:true}),h('span',{text:`Pioche : ${f.talon}`})) : null));
    const sn=h('div',{class:'snake'}); sn._ctx={line:f.line,i0,marks,choose:false,ends:{L,R:Rv}}; board.append(sn);
  } else board.append(h('p',{class:'boardmsg',text:'Les dominos viennent d’être distribués.'}));
  out.push(board);
  // every hand at this step
  const acted=m?m.seat:null;
  out.push(h('div',{class:'rp-hands'},f.hands.map((hand,p)=>h('div',{class:'rp-hand'+(acted===p?' act':'')},
    h('div',{class:'row',style:'gap:6px'},h('span',{class:'teamdot '+colorOf(s,p)}),h('b',{text:whoLabel(s,p)}),
      h('span',{class:'muted',style:'font-size:12.5px',text:`${hand.length} domino${hand.length>1?'s':''} · ${pipsOf(hand)} pts`})),
    h('div',{class:'reveal'},hand.length?hand.map(x=>tileEl(x[0],x[1],{v:true})):[h('span',{class:'muted',text:'Main vide'})])))));
  return out;
}


/* ======================= Fin de partie : fête, cirque et statistiques ======================= */
function requireNick(){
  if(myNick) return true;
  let v=null; try{ v=window.prompt('Votre nom (obligatoire) : il est vu par les autres joueurs et sert aux statistiques.'); }catch(e){}
  const n=cleanNick(v);
  if(!n){ toast('Le nom est obligatoire pour jouer.'); const el=document.getElementById('nick'); if(el) el.focus(); return false; }
  saveNick(n); const el=document.getElementById('nick'); if(el) el.value=n;
  return true;
}
const buzz=p=>{ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} };
function afterChange(prev,s){
  const my=mySeat();
  // partner question: tell the partner, then tell both players the answer
  if(s.ask && !prev.ask && my>=0 && partnerOf(s,s.ask.seat)===my){ buzz([150,80,150]); SFX.turn(); }
  const lastAns=[...(s.events||[])].reverse().find(e=>e.k==='askYes'||e.k==='askNo');
  const prevAns=[...(prev.events||[])].reverse().find(e=>e.k==='askYes'||e.k==='askNo');
  if(lastAns && lastAns.id && (!prevAns || prevAns.id!==lastAns.id) && my>=0){
    const yes=lastAns.k==='askYes';
    if(lastAns.seat===my) toast(yes?'Votre partenaire est d’accord : vous fermez le jeu.':'Votre partenaire refuse de fermer : jouez un autre domino.');
    else if(partnerOf(s,lastAns.seat)===my && lastAns.auto) toast(yes?'Pas de réponse : l’IA a accepté de fermer pour vous.':'Pas de réponse : l’IA a refusé de fermer pour vous.');
  }
  if(prev.status!=='over' && s.status==='over' && s.result) setTimeout(()=>celebrate(s),600);
}
function celebrate(s){
  const my=mySeat(), wg=grp(s,s.result.winner), myG=my>=0?grp(s,my):null;
  const zero=s.scores.map((x,g)=>g!==wg && x===0 ? g : -1).filter(g=>g>=0);
  const groupName=g=> s.teams ? [0,1,2,3].filter(p=>p%2===g).map(nameOf).join(' et ') : nameOf(g);
  if(zero.length){
    const meZero= myG!=null && zero.includes(myG);
    const plural= s.teams || zero.length>1;
    circus(meZero, zero.map(groupName).join(', '), plural, s);
    if(myG===wg) confetti(90);
  } else if(myG===wg){ confetti(70); buzz(200); }
  else if(myG!=null) buzz([120,60,120]);
}
function confetti(n){
  const cols=['#e3aa3c','#ec7c5f','#8ec3e6','#c7a3ec','#8fd19e','#e8283f','#f3eddc'];
  for(let i=0;i<n;i++){
    const d=h('div',{class:'confetti',style:`left:${Math.random()*100}vw;background:${cols[i%cols.length]};animation-duration:${2.2+Math.random()*2}s;animation-delay:${Math.random()*.8}s;transform:rotate(${Math.random()*360}deg)`});
    document.body.append(d); setTimeout(()=>d.remove(),5200);
  }
}
function circus(meZero,who,plural,s){
  buzz(meZero?[400,120,400,120,900]:[250,100,250]);
  SFX.circus();
  const icons=['🤡','🎪','🤹','🎈','🎺','🤡','🐒','🎠','🤡','🥁','🎈','🤡'];
  const ov=h('div',{class:'circus',role:'dialog','aria-modal':'true','aria-label':'Capot : perdu à zéro'},
    icons.map((x,i)=>h('span',{class:'clown','aria-hidden':'true',style:`left:${(i*8.3+Math.random()*4)%96}vw;animation-duration:${5+Math.random()*4}s;animation-delay:${-Math.random()*6}s`,text:x})),
    h('div',{class:'cbox'},
      h('div',{class:'cbig','aria-hidden':'true',text:'🤡'}),
      h('h2',{text:'CAPOT !'}),
      h('p',{class:'big',text: meZero ? 'Perdu à zéro… Bienvenue au cirque !' : `${who} ${plural?'perdent':'perd'} à zéro : direction le cirque !`}),
      h('p',{class:'muted',text:`Score final : ${s.scores.join(' – ')}`}),
      h('button',{class:'btn',onclick:()=>ov.remove(),text: meZero ? 'Je range mon nez rouge' : 'Fermer'})));
  document.body.append(ov);
}
const statKey=n=>cleanNick(n).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'joueur';
function recordStats(s){
  const my=mySeat(); if(my<0 || !s.result || s.result.winner==null || !s.gameId) return;
  const id=(localMode?'ia:':'net:')+s.code+':'+s.gameId;
  let done=[]; try{ done=JSON.parse(localStorage.getItem('domino-rec')||'[]'); }catch(e){}
  if(!Array.isArray(done)) done=[];
  if(done.includes(id)) return;
  try{ localStorage.setItem('domino-rec',JSON.stringify([...done,id].slice(-300))); }catch(e){}
  const g=grp(s,my), wg=grp(s,s.result.winner), win=g===wg;
  const zeroWin= win && s.scores.every((x,k)=>k===wg || x===0);
  const zeroLoss= !win && s.scores[g]===0;
  const inc=o=>({...o, games:(o.games||0)+1, wins:(o.wins||0)+(win?1:0), losses:(o.losses||0)+(win?0:1),
    winZero:(o.winZero||0)+(zeroWin?1:0), lossZero:(o.lossZero||0)+(zeroLoss?1:0), updatedAt:Date.now()});
  if(localMode){
    let o={}; try{ o=JSON.parse(localStorage.getItem('domino-stats-ia')||'{}')||{}; }catch(e){}
    try{ localStorage.setItem('domino-stats-ia',JSON.stringify(inc(o))); }catch(e){}
    return;
  }
  const nm=(s.nicks&&s.nicks[me])||myNick; if(!db || !nm) return;
  const key=statKey(nm), ref=db.doc('stats/'+key);
  ref.get().then(sn=>{ const o=sn.exists?(sn.data()||{}):{}; return ref.set({...inc(o),name:nm,key},{keep:true}); }).catch(()=>{});
}
let statsDocs=[], unsubStats=null;
function subscribeStats(){
  if(!db || unsubStats) return;
  unsubStats=db.collection('stats').orderBy('wins','desc').limit(300).onSnapshot(sn=>{ statsDocs=sn.docs.map(d=>d.data()); renderStats(); });
}
function statsCard(){
  return h('div',{class:'card',id:'stats-card'},
    h('h2',{text:'Statistiques des joueurs'}),
    h('p',{class:'hint',text:'Parties en ligne terminées, par nom de joueur. Grand Chelem : gagné à zéro. Capot 🤡 : perdu à zéro (direction le cirque).'}),
    h('div',{id:'stats-box'}));
}
function renderStats(){
  const box=document.getElementById('stats-box'); if(!box) return;
  const rows=statsDocs.filter(d=>d && d.name).sort((a,b)=>(b.wins||0)-(a.wins||0)||(b.games||0)-(a.games||0)||(a.lossZero||0)-(b.lossZero||0));
  const myKey=myNick?statKey(myNick):null;
  const head=['Joueur','Matchs','Gagnés','Perdus','Grand Chelem','Capot 🤡','% victoires'];
  const body= rows.length ? rows.map(d=>h('tr',{class:d.key===myKey?'me':null},
      h('td',{text:d.name}),[d.games,d.wins,d.losses,d.winZero,d.lossZero].map(x=>h('td',{text:String(x||0)})),
      h('td',{text:d.games?Math.round(100*(d.wins||0)/d.games)+' %':'–'})))
    : [h('tr',{},h('td',{colspan:'7',class:'muted',style:'text-align:left',text: db ? 'Aucune partie en ligne terminée pour l’instant.' : 'Statistiques indisponibles hors ligne.'}))];
  let o={}; try{ o=JSON.parse(localStorage.getItem('domino-stats-ia')||'{}')||{}; }catch(e){}
  box.replaceChildren(
    h('div',{class:'stwrap'},h('table',{class:'stats'},h('thead',{},h('tr',{},head.map(x=>h('th',{scope:'col',text:x})))),h('tbody',{},body))),
    h('p',{class:'hint',text:`Vous contre l’IA, sur cet appareil : ${o.games||0} match${(o.games||0)>1?'s':''}, ${o.wins||0} gagné${(o.wins||0)>1?'s':''}, ${o.losses||0} perdu${(o.losses||0)>1?'s':''}, ${o.winZero||0} grand chelem, ${o.lossZero||0} capot.`}));
}

/* ======================= Boot ======================= */
async function boot(){
  me=localId();
  renderLobby();
  db=await mqttDb();
  if(db) canWrite=true;
  booted=true;
  const m=/^#([A-Z]{4})$/.exec(location.hash||'');
  if(db && m && !localMode) openTable(m[1]);
  else if(!code) renderLobby();
}
window.addEventListener('hashchange',()=>{ const m=/^#([A-Z]{4})$/.exec(location.hash||''); if(db && m && m[1]!==code) openTable(m[1]); });
boot();
</script>
